# Legg PID-filen i /tmp slik at Nginx kan skrive til den
pid /tmp/nginx.pid;
error_log /dev/stderr error;

events {
    worker_connections 1024;
}

http {
    # Inkluder standard mime.types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /dev/stdout;

    # Flytt alle midlertidige filer fra read-only mapper til /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_tokens off;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (applied to all responses)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://data.norges-bank.no; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # NAIS health endpoints – return early without security headers/logging noise
        location = /internal/isAlive {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        location = /internal/isReady {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # Cache hashed assets aggressively, never cache index.html
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://data.norges-bank.no; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}