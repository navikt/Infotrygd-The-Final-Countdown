apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: infotrygd-the-final-countdown
  namespace: infotek
  labels:
    team: infotek
spec:
  image: "{{image}}"
  port: 8080

  azure:
    sidecar:
      enabled: false
      autoLogin: false
    application:
      enabled: false

  liveness:
    path: /internal/isAlive
    initialDelay: 5
    timeout: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /internal/isReady
    initialDelay: 5
    timeout: 5
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 256Mi
    requests:
      memory: 128Mi
  strategy:
    type: RollingUpdate
  replicas:
    min: 1
    max: 2

  ingresses:
    - {{appIngress}}
